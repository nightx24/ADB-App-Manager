app-id: io.github.nightx24.ADBAppManager
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: adb-app-manager
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=host:ro
  - --env=PATH=/app/bin:/usr/bin:/run/host/usr/bin
modules:
  - name: python-dependencies
    buildsystem: simple
    build-options:
      # pip needs network access while resolving and downloading PySide6.
      # Flatpak build sandboxes disable network access by default.
      build-args:
        - --share=network
    sources:
      - type: dir
        path: ..
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app 'PySide6>=6.7,<7'
  - name: adb-app-manager
    buildsystem: simple
    build-commands:
      - install -D -m 644 main.py /app/share/adb-app-manager/main.py
      - install -D -m 644 packaging/io.github.nightx24.ADBAppManager.desktop /app/share/applications/io.github.nightx24.ADBAppManager.desktop
      - install -D -m 644 packaging/adb-app-manager.desktop /app/share/applications/io.github.nightx24.ADBAppManager.desktop
      - install -D -m 644 packaging/adb-app-manager.svg /app/share/icons/hicolor/scalable/apps/io.github.nightx24.ADBAppManager.svg
      - install -D -m 755 packaging/flatpak-launcher.sh /app/bin/adb-app-manager
    sources:
      - type: dir
        path: ..
