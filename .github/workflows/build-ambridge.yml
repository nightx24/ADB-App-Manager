name: Build NightLab AMBridge APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'ambridge/**'
      - '.github/workflows/build-ambridge.yml'
  pull_request:
    paths:
      - 'ambridge/**'
      - '.github/workflows/build-ambridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ambridge:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p ambridge :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightLab-AMBridge-debug-APK
          path: ambridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach AMBridge APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ambridge/app/build/outputs/apk/debug/app-debug.apk
