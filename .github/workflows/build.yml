name: Build desktop releases

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ADB-App-Manager-Windows
          - os: ubuntu-22.04
            artifact_name: ADB-App-Manager-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ADB-App-Manager main.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/ADB-App-Manager.exe -DestinationPath release/ADB-App-Manager-Windows.zip
      - name: Package Linux executable and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          install -m 755 dist/ADB-App-Manager AppDir/usr/bin/adb-app-manager
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/adb-app-manager" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/adb-app-manager.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ADB App Manager
          Comment=Manage Android packages through ADB
          Exec=adb-app-manager
          Icon=adb-app-manager
          Categories=Utility;System;
          Terminal=false
          EOF
          cp AppDir/adb-app-manager.desktop AppDir/usr/share/applications/
          cat > AppDir/usr/share/icons/hicolor/scalable/apps/adb-app-manager.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="24" fill="#182333"/>
            <rect x="31" y="17" width="66" height="94" rx="11" fill="#e8edf5"/>
            <rect x="38" y="27" width="52" height="68" rx="4" fill="#315eaa"/>
            <circle cx="64" cy="103" r="3" fill="#182333"/>
            <path d="M48 57h32M48 68h32M48 79h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          </svg>
          EOF
          cp AppDir/usr/share/icons/hicolor/scalable/apps/adb-app-manager.svg AppDir/adb-app-manager.svg
          APPIMAGETOOL_URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          curl -fsSL "$APPIMAGETOOL_URL" -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "release/ADB-App-Manager-x86_64.AppImage"
          cp dist/ADB-App-Manager release/ADB-App-Manager
          chmod +x release/ADB-App-Manager
          tar -C release -czf release/ADB-App-Manager-Linux.tar.gz ADB-App-Manager

          # Debian/Ubuntu/Linux Mint package
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          DEB_ROOT="$PWD/deb-root"
          install -Dm755 dist/ADB-App-Manager "$DEB_ROOT/usr/bin/adb-app-manager"
          install -Dm644 AppDir/adb-app-manager.desktop "$DEB_ROOT/usr/share/applications/adb-app-manager.desktop"
          install -Dm644 AppDir/usr/share/icons/hicolor/scalable/apps/adb-app-manager.svg "$DEB_ROOT/usr/share/icons/hicolor/scalable/apps/adb-app-manager.svg"
          mkdir -p "$DEB_ROOT/DEBIAN"
          cat > "$DEB_ROOT/DEBIAN/control" <<'EOF'
          Package: adb-app-manager
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: adb
          Maintainer: nightx24
          Description: Android package manager and ADB debloating utility
           Manage Android packages, wireless ADB, and device tools.
          EOF
          dpkg-deb --root-owner-group --build "$DEB_ROOT" release/ADB-App-Manager-amd64.deb

          # RPM package for Fedora/RHEL/openSUSE-family systems
          RPM_ROOT="$PWD/rpmbuild"
          mkdir -p "$RPM_ROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          install -Dm755 dist/ADB-App-Manager "$RPM_ROOT/SOURCES/adb-app-manager"
          install -Dm644 AppDir/adb-app-manager.desktop "$RPM_ROOT/SOURCES/adb-app-manager.desktop"
          install -Dm644 AppDir/usr/share/icons/hicolor/scalable/apps/adb-app-manager.svg "$RPM_ROOT/SOURCES/adb-app-manager.svg"
          cat > "$RPM_ROOT/SPECS/adb-app-manager.spec" <<'EOF'
          Name:           adb-app-manager
          Version:        1.0.0
          Release:        1
          Summary:        Android package manager and ADB debloating utility
          License:        MIT
          BuildArch:      x86_64
          Requires:       android-tools
          Source0:        adb-app-manager
          Source1:        adb-app-manager.desktop
          Source2:        adb-app-manager.svg

          %description
          Manage Android packages, wireless ADB, and device tools.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_datadir}/applications
          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/scalable/apps
          install -m 0755 %{SOURCE0} %{buildroot}%{_bindir}/adb-app-manager
          install -m 0644 %{SOURCE1} %{buildroot}%{_datadir}/applications/adb-app-manager.desktop
          install -m 0644 %{SOURCE2} %{buildroot}%{_datadir}/icons/hicolor/scalable/apps/adb-app-manager.svg

          %files
          %{_bindir}/adb-app-manager
          %{_datadir}/applications/adb-app-manager.desktop
          %{_datadir}/icons/hicolor/scalable/apps/adb-app-manager.svg
          EOF
          rpmbuild --define "_topdir $RPM_ROOT" -bb "$RPM_ROOT/SPECS/adb-app-manager.spec"
          cp "$RPM_ROOT"/RPMS/x86_64/*.rpm release/ADB-App-Manager-x86_64.rpm
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

  flatpak:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.8 org.kde.Sdk//6.8
      - name: Build Flatpak bundle
        run: |
          mkdir -p release
          flatpak-builder --force-clean --repo=flatpak-repo build-dir packaging/io.github.nightx24.ADBAppManager.yml
          flatpak build-bundle flatpak-repo release/ADB-App-Manager.flatpak io.github.nightx24.ADBAppManager
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: ADB-App-Manager-Flatpak
          path: release/ADB-App-Manager.flatpak
          if-no-files-found: error
      - name: Publish Flatpak tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ADB-App-Manager.flatpak
